<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krepšinio klubų finansai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14213d;--mute:#5d6b7e;--line:#dde3ea;--a:#e08a1e;--b:#1f7a8c;--pos:#1d7a46;--neg:#b5382f;--hd:'Barlow Condensed','Arial Narrow',sans-serif;--tx:'Source Sans 3',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-t=light]){--bg:#0f1722;--card:#17212f;--ink:#e8edf3;--mute:#93a1b4;--line:#2a3648;--a:#f0a43c;--b:#4fb0c4;--pos:#5fcf8f;--neg:#ff7d72}}
:root[data-t=dark]{--bg:#0f1722;--card:#17212f;--ink:#e8edf3;--mute:#93a1b4;--line:#2a3648;--a:#f0a43c;--b:#4fb0c4;--pos:#5fcf8f;--neg:#ff7d72}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--tx)}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;padding:18px 20px 0;max-width:1200px;margin:auto}
h1{font:700 34px/1 var(--hd);margin:0;letter-spacing:.01em}
#st{color:var(--mute);font-size:14px;margin-left:auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.ic{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin-left:8px}
nav{display:flex;gap:4px;padding:14px 20px 0;max-width:1200px;margin:auto;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;font:700 20px var(--hd);padding:6px 12px;color:var(--mute);white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--a)}
main{max-width:1200px;margin:auto;padding:16px 20px 60px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 12px;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search]{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:200px;margin-left:auto}
.sum{color:var(--mute);font-size:14px;margin:0 0 10px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:700 16px var(--hd);color:var(--mute);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
th.l,td.l{text-align:left}
th[aria-sort]{color:var(--ink)}
td.l{position:sticky;left:0;background:var(--card)}
td small{display:block;color:var(--mute);font-size:12px;line-height:1.1}
tr:last-child td{border-bottom:0}
.sh{display:inline-flex;align-items:center;gap:8px}
.sh i{display:inline-block;width:70px;height:8px;background:var(--b);border-radius:2px;overflow:hidden;opacity:.9}
.sh i b{display:block;height:100%;background:var(--a)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.na{color:var(--mute)}
td a{margin-right:6px;color:var(--b)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.card h3{font:700 22px var(--hd);margin:0 0 6px}.card h3 span{color:var(--mute);font-size:16px;margin-left:6px}
.card p{margin:0 0 8px;font-size:15px}
.msg{background:var(--card);border:1px solid var(--neg);border-radius:8px;padding:16px;line-height:1.6}
</style>
</head>
<body>
<header><h1>Krepšinio klubų finansai</h1><span id="st">Kraunama…</span></header>
<nav role="tablist" id="tabs"></nav>
<main id="out"></main>
<script>
// ---- Nustatymai: Google lentelės ID (turi būti tikra Google Sheets lentelė, ne .xlsx) ----
const SHEET_ID="1cWx_skBNVz6XwtdFsHNX5Jhd2TwRLFiY";
// Kiekvienam lapui – galimi pavadinimai (su „/" ir be). Pirmas tinkamas naudojamas.
const SHEETS={b27:["Budgets 26/27","Budgets 2627"],b26:["Budgets 25/26","Budgets 2526"],w26:["World 25/26","World 2526"],att:["Attendance"],sal:["Player Salaries"],tax:["Taxes"]};
const NAT={France:"Prancūzija",Germany:"Vokietija",Spain:"Ispanija",Italy:"Italija",Lithuania:"Lietuva",Latvia:"Latvija",Finland:"Suomija",Greece:"Graikija",Israel:"Izraelis"};
const nf=new Intl.NumberFormat("lt-LT",{maximumFractionDigits:0});
const eur=n=>n==null?"–":nf.format(n)+" €";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g,"");
const nat=n=>NAT[n]||n;
const num=v=>{if(v==null)return null;const s=String(v).replace(/[\s\u00a0€$%]/g,"").replace(/,/g,"");if(!/^-?\d/.test(s))return null;const n=parseFloat(s);return isNaN(n)?null:n};
const txt=v=>{const s=String(v??"").trim();return(s===""||s==="-"||s[0]==="#")?"":s};
function csv(t){const R=[];let r=[],c="",q=0;for(let i=0;i<t.length;i++){const h=t[i];
 if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=h}
 else if(h=='"')q=1;else if(h==","){r.push(c);c=""}else if(h=="\n"){r.push(c);R.push(r);r=[];c=""}else if(h!="\r")c+=h}
 if(c||r.length){r.push(c);R.push(r)}return R}
let DEF;
async function raw(n){
 const res=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(n)}`);
 const t=await res.text();
 if(!res.ok||/^\s*</.test(t))throw new Error(`Lapas „${n}" neatsidaro (HTTP ${res.status})`);
 return t}
// Jei lapo pavadinimas neegzistuoja, Google tyliai grąžina pirmą lapą – tokį atsakymą atmetame
async function load(names,first){
 for(const n of names){const t=await raw(n);if(first||t!==DEF)return csv(t)}
 throw new Error(`Lapas „${names[0]}" nerastas – patikrinkite jo pavadinimą lentelėje`)}
// Suranda lenteles, kurių antraštės eilutė prasideda reikšme hdr antrame stulpelyje
function blocks(rows,hdr){const out=[];let title="";
 for(let i=0;i<rows.length;i++){const a=(rows[i][1]||"").trim();
  if(a===hdr){const h=rows[i].map(x=>x.trim()),d=[];let j=i+1;
   while(j<rows.length){const b=(rows[j][1]||"").trim();if(!b||b===hdr||/^Vidurkis/.test(b))break;d.push(rows[j]);j++}
   out.push({title,h,d});i=j-1}
  else if(a)title=a}
 return out}
const ix=(h,re)=>h.findIndex(x=>re.test(x));
function budgets(rows,season,world){const o=[];
 for(const b of blocks(rows,"Nation")){/* Google CSV „pameta" antraštes skaitinių stulpelių viršuje, todėl stulpeliai imami pagal vietą: B šalis, C klubas, D biudžetas, E algos, H vieta, I Europa, J+ šaltiniai */
  const h=b.h,c={n:1,club:2,t:3,s:4,p:7,e:8};
  const src=[9,10,11,12,13];
  for(const r of b.d){if(!txt(r[c.club]))continue;
   o.push({season,nation:nat(r[1].trim()),club:r[c.club].trim(),total:num(r[c.t]),sal:num(r[c.s]),place:num(r[c.p]),eu:txt(r[c.e]),src:src.map(i=>(r[i]||"").trim()).filter(u=>/^https?:/.test(u))})}}
 return o}
function attendance(rows){const o=[];
 for(const b of blocks(rows,"Klubas")){const nation=/^Pranc/.test(b.title)?"Prancūzija":/^Vokiet/.test(b.title)?"Vokietija":/^Ispan/.test(b.title)?"Ispanija":/^Ital/.test(b.title)?"Italija":b.title.replace(/\s*\(.*/,"").replace(/ lyga$/,"");
  for(const r of b.d){const nums=String(r[3]).split("/").map(num).filter(x=>x!=null),avg=num(r[2]),cap=nums.length?nums[nums.length-1]:null;
   o.push({nation,club:r[1].trim(),avg,capTxt:txt(r[3]),cap,multi:nums.length>1,fill:avg!=null&&cap?avg/cap:null,place:num(r[5])})}}
 return o}
function salaries(rows){const o=[];
 for(const b of blocks(rows,"Role")){const g=i=>i;
  for(const r of b.d){if(!txt(r[2]))continue;
   o.push({role:r[1].trim(),name:r[2].trim(),country:(r[3]||"").trim(),team:txt(r[4]),season:txt(r[5]),value:num(r[6]),len:txt(r[7]),month:num(r[8]),src:(r[9]||"").trim()})}}
 return o}
function taxes(rows){return rows.filter(r=>txt(r[3])&&!/^https?:/.test(r[1])).map(r=>({country:r[1].trim(),season:txt(r[2]),text:r[3].trim(),src:(r[4]||"").trim()}))}

// ---- Būsena ir atvaizdavimas ----
const D={};const S={tab:"bud",season:"26/27",nation:"",q:"",sort:{bud:["total",-1],att:["avg",-1],sal:["month",-1]}};
const TABS=[["bud","Biudžetai"],["att","Lankomumas"],["sal","Žaidėjų algos"],["tax","Mokesčiai"]];
const money=k=>({k,v:r=>r[k],f:r=>`<span class="${r[k]==null?"na":""}">${eur(r[k])}</span>`});
const links=r=>(r.src||[]).map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener" title="${esc(u)}">${i+1}</a>`).join("")||'<span class="na">–</span>';
function budgetRows(){
 const prev=new Map(D.bud.filter(r=>r.season==="25/26").map(r=>[r.nation+norm(r.club),r]));
 return D.bud.filter(r=>r.season===S.season).map(r=>{const p=prev.get(r.nation+norm(r.club));
  return{...r,share:r.total&&r.sal!=null?r.sal/r.total:null,chg:S.season==="26/27"&&r.total&&p&&p.total?r.total/p.total-1:null}})}
const COLS={
 bud:[{k:"club",l:1,label:"Klubas",v:r=>r.club,f:r=>`<b>${esc(r.club)}</b><small>${esc(r.nation)}</small>`},
  {...money("total"),label:"Bendras biudžetas"},{...money("sal"),label:"Atlyginimų biudžetas"},
  {k:"share",label:"Atlyginimų dalis",v:r=>r.share,f:r=>r.share==null?'<span class="na">–</span>':`<span class="sh">${Math.round(r.share*100)}%<i><b style="width:${Math.min(100,r.share*100)}%"></b></i></span>`},
  {k:"chg",label:"Pokytis pagal praėjusį sezoną",v:r=>r.chg,f:r=>r.chg==null?'<span class="na">–</span>':`<span class="${r.chg>=0?"pos":"neg"}">${r.chg>=0?"+":""}${Math.round(r.chg*100)}%</span>`},
  {k:"place",label:"Vieta lygoje",v:r=>r.place,f:r=>r.place??"–"},
  {k:"eu",label:"Europos turnyras",v:r=>r.eu,f:r=>esc(r.eu)||"–"},
  {k:"src",label:"Šaltiniai",nosort:1,v:r=>r.src.length||"",f:links}],
 att:[{k:"club",l:1,label:"Klubas",v:r=>r.club,f:r=>`<b>${esc(r.club)}</b><small>${esc(r.nation)}</small>`},
  {k:"avg",label:"Vid. žiūrovų",v:r=>r.avg,f:r=>r.avg==null?"–":nf.format(r.avg)},
  {k:"cap",label:"Arenos talpa",v:r=>r.cap,f:r=>r.cap==null?"–":nf.format(r.cap)+(r.multi?`<span title="Lape nurodytos dvi talpos (${esc(r.capTxt)}); užpildymas skaičiuotas pagal mažesnę">*</span>`:"")},
  {k:"fill",label:"Užpildymas",v:r=>r.fill,f:r=>r.fill==null?'<span class="na">–</span>':`<span class="sh">${Math.round(r.fill*100)}%<i><b style="width:${Math.min(100,r.fill*100)}%"></b></i></span>`},
  {k:"place",label:"Vieta lygoje",v:r=>r.place,f:r=>r.place??"–"}],
 sal:[{k:"name",l:1,label:"Žaidėjas / treneris",v:r=>r.name,f:r=>`<b>${esc(r.name)}</b><small>${esc(r.role)}</small>`},
  {k:"team",label:"Komanda",v:r=>r.team,f:r=>esc(r.team)||"–"},{k:"country",label:"Šalis",v:r=>r.country,f:r=>esc(r.country)},
  {k:"season",label:"Sezonas",v:r=>r.season,f:r=>esc(r.season)||"–"},
  {k:"value",label:"Sutarties vertė",v:r=>r.value,f:r=>eur(r.value)},{k:"len",label:"Trukmė",v:r=>r.len,f:r=>esc(r.len)||"–"},
  {k:"month",label:"Mėnesio alga",v:r=>r.month,f:r=>eur(r.month)},
  {k:"src",label:"Šaltinis",nosort:1,v:r=>r.src,f:r=>/^https?:/.test(r.src)?`<a href="${esc(r.src)}" target="_blank" rel="noopener">nuoroda</a>`:"–"}]};
function sorted(rows,key,cols){const[k,d]=S.sort[key],c=cols.find(x=>x.k===k)||cols[0];
 return[...rows].sort((a,b)=>{const x=c.v(a),y=c.v(b),nx=x==null||x==="",ny=y==null||y==="";if(nx||ny)return nx-ny;
  return(typeof x==="string"?x.localeCompare(y,"lt"):x-y)*d})}
function table(key,all){
 const q=norm(S.q),nations=[...new Set(all.map(r=>r.nation||r.country))].filter(Boolean).sort();
 let rows=all.filter(r=>(!S.nation||(r.nation||r.country)===S.nation)&&(!q||norm([r.club,r.name,r.team,r.nation,r.country].join(" ")).includes(q)));
 const cols=COLS[key].filter(c=>rows.some(r=>{const v=c.v(r);return v!=null&&v!==""})||c.k==="club");
 rows=sorted(rows,key,cols);
 const[sk,sd]=S.sort[key];
 const full=rows.filter(r=>key==="bud"?r.total!=null&&r.sal!=null:key==="att"?r.fill!=null:r.month!=null||r.value!=null).length;
 const sh=rows.filter(r=>r.share!=null),avg=sh.length?Math.round(sh.reduce((s,r)=>s+r.share,0)/sh.length*100):null;
 const seasons=key==="bud"?`<div class="bar">${["26/27","25/26"].map(s=>`<button class="chip" data-season="${s}" aria-pressed="${S.season===s}">Sezonas ${s}</button>`).join("")}</div>`:"";
 const chips=`<div class="bar"><button class="chip" data-nation="" aria-pressed="${!S.nation}">Visos</button>${nations.map(n=>`<button class="chip" data-nation="${esc(n)}" aria-pressed="${S.nation===n}">${esc(n)}</button>`).join("")}<input type="search" id="q" placeholder="Ieškoti…" value="${esc(S.q)}" aria-label="Paieška"></div>`;
 const head=cols.map(c=>`<th class="${c.l?"l":""}" ${c.nosort?"":`data-k="${c.k}" tabindex="0"`} ${sk===c.k?`aria-sort="${sd>0?"ascending":"descending"}"`:""}>${c.label}${sk===c.k?(sd>0?" ▲":" ▼"):""}</th>`).join("");
 const body=rows.slice(0,300).map(r=>`<tr>${cols.map(c=>`<td class="${c.l?"l":""}">${c.f(r)}</td>`).join("")}</tr>`).join("");
 return`${seasons}${chips}<p class="sum">${rows.length} įrašų, iš jų pilnų duomenų: ${full}${avg!=null?` · vidutinė atlyginimų dalis: ${avg}% (iš ${sh.length})`:""}. ${rows.length>300?" Rodoma pirmos 300 eilučių – siaurinkite paieška ar filtru.":""} Tušti langeliai rodomi „–“ ir į vidurkius neįtraukiami.</p><div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body||'<tr><td class="l">Nieko nerasta</td></tr>'}</tbody></table></div>`}
function render(){
 $tabs.innerHTML=TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join("");
 const f=document.activeElement&&document.activeElement.id==="q";
 out.innerHTML=S.tab==="tax"?`<div class="cards">${D.tax.map(t=>`<div class="card"><h3>${esc(nat(t.country))}<span>${esc(t.season)}</span></h3>${t.text.split(/\\n\\n|\n\n/).map(p=>`<p>${esc(p.replace(/\\n/g," "))}</p>`).join("")}${/^https?:/.test(t.src)?`<a href="${esc(t.src)}" target="_blank" rel="noopener">Šaltinis</a>`:""}</div>`).join("")}</div>`
  :table(S.tab,S.tab==="bud"?budgetRows():D[S.tab]);
 if(f){const i=$("q");i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
const $=id=>document.getElementById(id),$tabs=$("tabs"),out=$("out");
document.addEventListener("click",e=>{const t=e.target.closest("[data-tab],[data-nation],[data-season],th[data-k],#reload");if(!t)return;
 if(t.dataset.tab){S.tab=t.dataset.tab;S.nation="";S.q=""}
 else if(t.dataset.nation!==undefined)S.nation=t.dataset.nation;
 else if(t.dataset.season)S.season=t.dataset.season;
 else if(t.dataset.k){const s=S.sort[S.tab];S.sort[S.tab]=[t.dataset.k,s[0]===t.dataset.k?-s[1]:(t.dataset.k==="club"||t.dataset.k==="name"?1:-1)]}
 else return start();
 render()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("th[data-k]"))e.target.click()});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;render()}});
async function start(){
 $("st").textContent="Kraunama…";
 try{
  DEF=await raw("__nera_tokio_lapo__");
  const[a,b,w,at,sa,tx]=await Promise.all(Object.values(SHEETS).map((n,i)=>load(n,i===0)));
  D.bud=[...budgets(a,"26/27"),...budgets(b,"25/26"),...budgets(w,"25/26")];D.att=attendance(at);D.sal=salaries(sa);D.tax=taxes(tx);
  $("st").innerHTML=`Atnaujinta ${new Date().toLocaleTimeString("lt-LT",{hour:"2-digit",minute:"2-digit"})}<button class="ic" id="reload" title="Perkrauti duomenis iš lentelės">Atnaujinti</button>`;
  render()
 }catch(err){
  $("st").innerHTML='<button class="ic" id="reload">Bandyti dar kartą</button>';
  out.innerHTML=`<div class="msg"><b>Nepavyko gauti duomenų iš Google Sheets.</b><br>${esc(err.message)}<br>Patikrinkite: 1) failas turi būti išsaugotas kaip Google Sheets (<i>Failas → Išsaugoti kaip Google Sheets</i>), 2) bendrinimas: „Visi, turintys nuorodą – žiūrėtojas“, 3) kode nurodytas teisingas lentelės ID, 4) lapų pavadinimai sutampa.</div>`}}
start();
</script>
</body>
</html>
